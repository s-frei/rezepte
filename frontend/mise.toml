[tasks."install:deps"]
description = "Install frontend dependencies only, without the Playwright browser"
# The release workflow builds the SPA but runs no browser test, and it runs
# after the image is already pushed. Downloading Chromium there would let a
# slow or failing Playwright CDN leave a tag with a published image and no
# GitHub release, so the release path installs packages and nothing else.
run = "bun install --frozen-lockfile"

[tasks.install]
description = "Install frontend dependencies and the Playwright browser"
depends = ["install:deps"]
run = "bunx playwright install ${PLAYWRIGHT_INSTALL_ARGS:-} chromium"

[tasks.dev]
description = "Run the SvelteKit dev server"
run = "bun run dev"

[tasks.e2e]
description = "Run Playwright tests (expects the app on E2E_BASE_URL or :8060 at offset 0, see mise run ports)"
usage = 'arg "[args]..." var=#true help="Passed to Playwright: spec files, --grep, --headed or other Playwright flags"'
run = "bun run test:e2e{% for a in usage.args %} {{ a | quote }}{% endfor %}"

[tasks."messages:parity"]
description = "Fail if the message catalogs do not hold the same keys"
run = "bun run messages:parity"

[tasks."brand:export"]
description = "Generate favicon, touch icon, manifest icons and manifest from assets/brand/logo"
run = "bun run brand:export"

[tasks."brand:check"]
description = "Audit the logo masters and the committed icon exports"
run = "bun test scripts/brand.test.ts"

[tasks.check]
description = "svelte-check, lint and unit tests"
depends = ["lint", "test", "messages:parity", "brand:check"]
run = "bun run check"

[tasks.lint]
description = "Prettier check and ESLint"
run = "bun run lint"

[tasks.fmt]
description = "Format with Prettier"
run = "bun run format"

[tasks.test]
description = "Run Vitest once"
usage = 'arg "[args]..." var=#true help="Passed to Vitest: test files, a name filter with -t, or other Vitest flags"'
run = "bun run test{% for a in usage.args %} {{ a | quote }}{% endfor %}"

[tasks.build]
description = "Build the SPA into service/internal/web/dist"
run = "bun run build && touch ../service/internal/web/dist/.gitkeep"
