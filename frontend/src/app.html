<!doctype html>

<html lang="en">
	<head>
		<meta charset="utf-8" />

		<script>
			// Applies the stored theme before the first paint so a dark-mode
			// user never sees a light flash. Mirrors src/lib/theme.ts. Wrapped in
			// an IIFE so `theme` stays out of `window`.
			(function () {
				try {
					var theme = localStorage.getItem('rezepte-theme');
					if (theme === 'light' || theme === 'dark') {
						document.documentElement.setAttribute('data-theme', theme);
					}
				} catch (_) {}
			})();
		</script>

		<meta name="viewport" content="width=device-width, initial-scale=1" />

		<link rel="icon" href="%sveltekit.assets%/favicon.ico" sizes="32x32" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		<title>Rezepte</title>
		%sveltekit.head%
	</head>

	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
