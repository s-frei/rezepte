<!doctype html>

<html lang="en">
	<head>
		<meta charset="utf-8" />

		<script>
			// Applies the stored theme before the first paint so a dark-mode
			// user never sees a light flash. Mirrors src/lib/theme.ts. Wrapped in
			// an IIFE so `theme` stays out of `window`.
			(function () {
				try {
					var theme = localStorage.getItem('rezepte-theme');
					if (theme === 'light' || theme === 'dark') {
						document.documentElement.setAttribute('data-theme', theme);
					}
				} catch (_) {}
			})();
		</script>

		<meta name="viewport" content="width=device-width, initial-scale=1" />

		<link rel="icon" href="%sveltekit.assets%/favicon.ico" sizes="32x32" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		<!--
			Link preview for a shared URL, in the Open Graph and Twitter Card
			tags that WhatsApp, Signal, Telegram, iMessage, Slack, Discord,
			Mastodon, X, Facebook and LinkedIn all read. The build can only write
			paths; the Go service makes og:url, og:image and twitter:image
			absolute for the request's origin when it serves this page
			(service/internal/httpserver/spa.go), because most crawlers ignore a
			relative one. A shared recipe's page gets its own title, description
			and cover in these tags when the household allows it
			(service/internal/preview).
		-->
		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="Rezepte" />
		<meta property="og:title" content="Rezepte" />
		<meta property="og:description" content="A self-hosted recipe manager for your household" />
		<meta property="og:url" content="/" />
		<meta property="og:image" content="%sveltekit.assets%/og.png" />
		<meta property="og:image:type" content="image/png" />
		<meta property="og:image:width" content="1280" />
		<meta property="og:image:height" content="640" />
		<meta
			property="og:image:alt"
			content="The Rezepte mascot, a waving cookbook holding a wooden spoon, beside the name Rezepte"
		/>
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:image" content="%sveltekit.assets%/og.png" />
		<meta
			name="twitter:image:alt"
			content="The Rezepte mascot, a waving cookbook holding a wooden spoon, beside the name Rezepte"
		/>
		<title>Rezepte</title>
		%sveltekit.head%
	</head>

	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
