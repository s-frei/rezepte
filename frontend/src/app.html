<!doctype html>

<html lang="en">
	<head>
		<meta charset="utf-8" />

		<script>
			// Applies the stored theme before the first paint so a dark-mode
			// user never sees a light flash. Mirrors src/lib/theme.ts. Wrapped in
			// an IIFE so `theme` stays out of `window`.
			(function () {
				try {
					var theme = localStorage.getItem('rezepte-theme');
					if (theme === 'light' || theme === 'dark') {
						document.documentElement.setAttribute('data-theme', theme);
					}
				} catch (_) {}
			})();
		</script>

		<meta name="viewport" content="width=device-width, initial-scale=1" />

		<link rel="icon" href="%sveltekit.assets%/favicon.ico" sizes="32x32" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		<!--
			Link preview for a shared URL. An instance does not know its own public
			address, so og:image stays relative: most chat apps resolve it, strict
			crawlers that demand an absolute URL show no picture. Every page is
			behind a login, so the preview is the app's, never a recipe's.
		-->
		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="Rezepte" />
		<meta property="og:title" content="Rezepte" />
		<meta property="og:description" content="A self-hosted recipe manager for your household" />
		<meta property="og:image" content="%sveltekit.assets%/og.png" />
		<meta property="og:image:width" content="1280" />
		<meta property="og:image:height" content="640" />
		<meta name="twitter:card" content="summary_large_image" />
		<title>Rezepte</title>
		%sveltekit.head%
	</head>

	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
