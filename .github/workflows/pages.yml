name: Pages

on:
  # Called by `.github/workflows/ci.yml` once the gate is green, so a push to
  # `main` publishes only what CI has already accepted.
  workflow_call:
  # Dispatched by hand to republish without a merge - a documentation fix, or a
  # change to this workflow, which can only be tested on the branch that carries
  # it. The first step keeps that to `main` and `develop`.
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: "Reject a manual run from another branch"
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main' && github.ref != 'refs/heads/develop'
        run: |
          echo "A manual run publishes the selected ref to the live site. Dispatch from main or develop." >&2
          exit 1

      - name: "Check out the repository"
        uses: actions/checkout@v7

      - name: "Set up mise"
        uses: jdx/mise-action@v4
        with:
          cache: true

      - name: "Install the user documentation dependencies"
        run: mise run //docs/user:install

      - name: "Build the user documentation"
        run: mise run //docs/user:build

      - name: "Upload the Pages artifact"
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/user/out

      - name: "Deploy to GitHub Pages"
        id: deployment
        uses: actions/deploy-pages@v5
