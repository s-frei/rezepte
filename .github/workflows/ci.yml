name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          cache: true
      - run: mise run setup
        env:
          PLAYWRIGHT_INSTALL_ARGS: --with-deps
      - run: mise run //docs/user:openapi
      - name: Fail on uncommitted generated changes
        run: git diff --exit-code
      - run: mise run check
      - run: mise run build
      - run: mise run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: frontend/test-results

  docker:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: rezepte:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  pages:
    if: github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          cache: true
      - run: mise run //docs/user:install
      - run: mise run //docs/user:build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/user/out
      - id: deployment
        uses: actions/deploy-pages@v4
