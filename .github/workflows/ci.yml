name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: "Check out the repository"
        uses: actions/checkout@v7

      - name: "Set up mise"
        uses: jdx/mise-action@v4
        with:
          cache: true

      - name: "Install dependencies"
        run: mise run setup
        env:
          PLAYWRIGHT_INSTALL_ARGS: --with-deps

      - name: "Generate the OpenAPI documentation"
        run: mise run //docs/user:openapi

      - name: "Fail on uncommitted generated changes"
        run: git diff --exit-code

      - name: "Run all lint, format and test gates"
        run: mise run check

      - name: "Build the frontend and the Go binary"
        run: mise run build

      - name: "Run the Playwright end-to-end tests"
        run: mise run e2e

      - name: "Upload the Playwright results"
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-results
          path: frontend/test-results

  docker:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - name: "Check out the repository"
        uses: actions/checkout@v7

      - name: "Set up mise"
        uses: jdx/mise-action@v4
        with:
          cache: true

      - name: "Set up Docker Buildx"
        uses: docker/setup-buildx-action@v4

      - name: "Validate the compose files"
        run: mise run docker:compose:check

      - name: "Build the container image"
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          platforms: linux/amd64,linux/arm64
          tags: rezepte:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  pages:
    if: github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: "Check out the repository"
        uses: actions/checkout@v7

      - name: "Set up mise"
        uses: jdx/mise-action@v4
        with:
          cache: true

      - name: "Install the user documentation dependencies"
        run: mise run //docs/user:install

      - name: "Build the user documentation"
        run: mise run //docs/user:build

      - name: "Upload the Pages artifact"
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/user/out

      - name: "Deploy to GitHub Pages"
        id: deployment
        uses: actions/deploy-pages@v5
