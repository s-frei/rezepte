name: Check

on:
  # Called by `.github/workflows/ci.yml` on every push and pull request, and by
  # `.github/workflows/release.yml` before it publishes anything.
  workflow_call:

jobs:
  # `mise run check` is a list of independent gates. On one runner they share
  # four cores and each takes minutes; here every gate gets a runner of its
  # own. The list is read from mise.toml, so a gate added there runs here
  # without touching this file.
  plan:
    runs-on: ubuntu-latest
    outputs:
      gates: ${{ steps.gates.outputs.gates }}
    steps:
      - name: "Check out the repository"
        uses: actions/checkout@v7

      - name: "Set up mise"
        uses: jdx/mise-action@v4
        with:
          cache: true

      - name: "List the gates of mise run check"
        id: gates
        # `check` must stay a pure list of depends: a `run` of its own would
        # never execute here, because only the depends become jobs.
        run: |
          info="$(mise tasks info check --json)"
          if ! jq -e '.run == [] and .file == null' <<<"$info" >/dev/null; then
            echo "The check task has a run of its own, which this workflow would skip. Move it into a task check depends on." >&2
            exit 1
          fi
          echo "gates=$(jq -c .depends <<<"$info")" >> "$GITHUB_OUTPUT"

  gate:
    name: ${{ matrix.task }}
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        task: ${{ fromJSON(needs.plan.outputs.gates) }}
    steps:
      - name: "Check out the repository"
        uses: actions/checkout@v7

      - name: "Set up mise"
        uses: jdx/mise-action@v4
        with:
          cache: true

      - name: "Restore the Go and Bun caches"
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
            ~/.cache/golangci-lint
            ~/.bun/install/cache
          key: gate-${{ matrix.task }}-${{ hashFiles('service/go.sum', '**/bun.lock') }}
          restore-keys: gate-${{ matrix.task }}-

      - name: "Install dependencies"
        run: mise run setup

      - name: "Run the gate"
        run: mise run "${{ matrix.task }}"

  generated:
    runs-on: ubuntu-latest
    steps:
      - name: "Check out the repository"
        uses: actions/checkout@v7

      - name: "Set up mise"
        uses: jdx/mise-action@v4
        with:
          cache: true

      - name: "Restore the Go and Bun caches"
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
            ~/.bun/install/cache
          key: generated-${{ hashFiles('service/go.sum', '**/bun.lock') }}
          restore-keys: generated-

      - name: "Install dependencies"
        run: mise run setup

      - name: "Generate the OpenAPI documentation"
        run: mise run //docs/user:openapi

      - name: "Fail on uncommitted generated changes"
        run: git diff --exit-code

  e2e:
    name: e2e (${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - name: "Check out the repository"
        uses: actions/checkout@v7

      - name: "Set up mise"
        uses: jdx/mise-action@v4
        with:
          cache: true

      - name: "Restore the Go and Bun caches"
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
            ~/.bun/install/cache
          key: e2e-${{ hashFiles('service/go.sum', '**/bun.lock') }}
          restore-keys: e2e-

      - name: "Install dependencies"
        run: mise run setup
        env:
          PLAYWRIGHT_INSTALL_ARGS: --with-deps

      - name: "Build and run the Playwright end-to-end tests"
        run: mise run e2e --shard=${{ matrix.shard }}/2

      - name: "Upload the Playwright results"
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-results-${{ matrix.shard }}
          path: frontend/test-results
