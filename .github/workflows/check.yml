name: Check

on:
  # Called by `.github/workflows/ci.yml` on every push and pull request, and by
  # `.github/workflows/release.yml` before it publishes anything.
  workflow_call:

jobs:
  # `mise run check` is a list of independent gates. On one runner they share
  # four cores and each takes minutes; here every gate gets a runner of its
  # own. The list is read from mise.toml, so a gate added there runs here
  # without touching this file.
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      gates: ${{ steps.gates.outputs.gates }}
    steps:
      - name: "Check out the repository"
        uses: actions/checkout@v7

      - name: "Set up mise"
        uses: jdx/mise-action@v5
        with:
          cache: true

      - name: "List the gates of mise run check"
        id: gates
        # `check` must stay a pure list of depends: a `run` of its own would
        # never execute here, because only the depends become jobs.
        run: |
          info="$(mise tasks info check --json)"
          if ! jq -e '.run == [] and .file == null' <<<"$info" >/dev/null; then
            echo "The check task has a run of its own, which this workflow would skip. Move it into a task check depends on." >&2
            exit 1
          fi
          echo "gates=$(jq -c .depends <<<"$info")" >> "$GITHUB_OUTPUT"

  gate:
    name: ${{ matrix.task }}
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        task: ${{ fromJSON(needs.plan.outputs.gates) }}
    steps:
      - name: "Check out the repository"
        uses: actions/checkout@v7

      - name: "Set up the toolchain"
        uses: ./.github/actions/setup
        with:
          cache-key: gate-${{ matrix.task }}

      - name: "Run the gate"
        run: mise run "${{ matrix.task }}"

  generated:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: "Check out the repository"
        uses: actions/checkout@v7

      - name: "Set up the toolchain"
        uses: ./.github/actions/setup
        with:
          cache-key: generated

      - name: "Generate the OpenAPI documentation"
        run: mise run //docs/user:openapi

      - name: "Fail on uncommitted generated changes"
        run: git diff --exit-code

  e2e:
    name: e2e (${{ matrix.shard }}/4)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Playwright's image carries the browsers and every system library they
    # need, so no shard downloads a few hundred MB of fonts and codecs from
    # the Ubuntu mirror on every run. Its tag must match @playwright/test in
    # frontend/bun.lock: `mise run playwright:image:check` fails the gate
    # otherwise, and Renovate moves both in one pull request.
    # As the runner's own UID: the workspace belongs to it, and git refuses
    # a repository owned by another user, which root in the container is.
    # --ipc=host because Docker gives a container 64 MB of /dev/shm and
    # Chromium needs more; with less, tests time out at random.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --user 1001 --ipc=host
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: "Check out the repository"
        uses: actions/checkout@v7

      - name: "Set up the toolchain"
        uses: ./.github/actions/setup
        with:
          # Not shared with the jobs on the runner: actions/cache stores paths
          # relative to the workspace, and the container's HOME sits elsewhere,
          # so their archive cannot be unpacked here.
          cache-key: e2e-container

      - name: "Build and run the Playwright end-to-end tests"
        run: mise run e2e --shard=${{ matrix.shard }}/4

      - name: "Upload the Playwright results"
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-results-${{ matrix.shard }}
          path: frontend/test-results
