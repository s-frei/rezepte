[tasks.install]
description = "Install docs dependencies"
run = "bun install --frozen-lockfile"

[tasks.dev]
description = "Run the docs site"
run = "bun run dev"

[tasks.build]
description = "Static export of the docs"
run = "bun run build"

[tasks.check]
description = "Lint, memory audit and build (validates MDX)"
run = ["bun run lint", "bun run memory:audit", "bun run build"]
