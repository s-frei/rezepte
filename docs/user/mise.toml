[tasks.install]
description = "Install user-docs dependencies"
run = "bun install --frozen-lockfile"

[tasks.dev]
description = "Run the user docs on :4001 by default (mise run ports for this worktree)"
run = "bun run dev"

[tasks.build]
description = "Static export of the user docs"
run = "bun run build"

[tasks.check]
description = "Lint, screenshot audit, README image, hero image, logo copy and OpenAPI version tests, build (validates MDX), base-path and published-URLs audits"
run = ["bun run lint", "bun run screenshots:audit", "bun test scripts/readme-images.test.ts scripts/hero-images.test.ts scripts/brand-assets.test.ts scripts/openapi-version.test.ts", "bun run build", "bun run base-path:audit", "bun run published-urls:audit"]
# Builds as GitHub Pages does, under /rezepte, so the audit has a prefix to check.
env = { RZP_DOCS_PAGES = "1" }

[tasks.openapi]
description = "Fetch openapi.json from rezepte --demo and regenerate content/api/reference/"
# //:demo brings the binary through its own depends, waits for /healthz and
# stops the instance afterwards.
run = ["mise run //:demo -- bun run openapi:fetch", "bun run openapi:generate"]
# The screenshots' port, not the demo's, so a running demo can stay up.
env = { RZP_DEMO_INSTANCE_PORT = "{{ env.RZP_SCREENSHOTS_PORT }}", RZP_DEMO_MAIL = "off" }

[tasks.screenshots]
description = "Regenerate the screenshots against rezepte --demo on its own port, :8080 by default (needs a Chromium that starts; not run in CI)"
# `--update-snapshots` alone writes only what exceeds maxDiffPixelRatio, so a
# change too small for the tolerance - a typeface swap across a few lines of a
# 1440x900 page - leaves stale PNGs behind. Regenerating means all of them.
usage = 'arg "[args]..." var=#true help="Passed to Playwright: spec files or --grep to regenerate only some screenshots"'
run = [
	"mise run //:demo -- bunx playwright test --update-snapshots=all{% for a in usage.args %} {{ a | quote }}{% endfor %}",
	"bun run readme-images",
	"bun run hero-images",
]
# The pictures are English whatever the developer's own REZEPTE_LOCALE says:
# the demo seeds its recipes and its account in that language, and the specs
# select by English names. Not REZEPTE_LOCALE itself: the nested
# `mise run //:demo` loads the config env again, and a REZEPTE_LOCALE set in
# a mise.local.toml would win over this one. demo.sh prefers RZP_DEMO_LOCALE.
# RZP_DEMO_OIDC=stub: demo.sh starts mise/lib/stub-issuer.ts, a provider
# that only answers discovery, and saves it with no name through the
# settings API, so every shot shows the neutral "Continue with single
# sign-on" and jonas's linked row whether or not Dex runs. No sign-in ever
# runs against it.
# RZP_DEMO_NOW is FIXED_TIME in screenshots/helpers.ts: the demo dates its
# samples, their comments and its tokens from the instant the browser clock
# is frozen at.
env = { RZP_DEMO_MAIL = "off", RZP_DEMO_LOCALE = "en", RZP_DEMO_NOW = "2026-09-17T10:30:00+02:00", RZP_DEMO_INSTANCE_PORT = "{{ env.RZP_SCREENSHOTS_PORT }}", REZEPTE_PUBLIC_URL = "http://localhost:{{ env.RZP_SCREENSHOTS_PORT }}", RZP_DEMO_OIDC = "stub" }

[tasks."brand-assets"]
description = "Copy the logo, favicon and social preview into the docs site (public/brand, app/)"
run = "bun run brand-assets"

[tasks."readme-images"]
description = "Round the README screenshots into assets/readme; screenshots runs it too"
run = "bun run readme-images"

[tasks."hero-images"]
description = "Paint the mascot scenes with the current screenshots on their screens (public/heroes); screenshots runs it too"
run = "bun run hero-images"

[tasks."screenshots:audit"]
description = "Cross-check <Screenshot> names, tests and PNG files"
run = "bun run screenshots:audit"

[tasks."screenshots:check"]
description = "Report screenshot drift against rezepte --demo (local only)"
usage = 'arg "[args]..." var=#true help="Passed to Playwright: spec files or --grep to check only some screenshots"'
run = "mise run //:demo -- bunx playwright test{% for a in usage.args %} {{ a | quote }}{% endfor %}"
env = { RZP_DEMO_MAIL = "off", RZP_DEMO_LOCALE = "en", RZP_DEMO_NOW = "2026-09-17T10:30:00+02:00", RZP_DEMO_INSTANCE_PORT = "{{ env.RZP_SCREENSHOTS_PORT }}", REZEPTE_PUBLIC_URL = "http://localhost:{{ env.RZP_SCREENSHOTS_PORT }}", RZP_DEMO_OIDC = "stub" } # see tasks.screenshots
