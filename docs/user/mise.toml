[tasks.install]
description = "Install user-docs dependencies"
run = "bun install --frozen-lockfile"

[tasks.dev]
description = "Run the user docs on :4001/rezepte"
run = "bun run dev"

[tasks.build]
description = "Static export of the user docs"
run = "bun run build"

[tasks.check]
description = "Lint, screenshot audit, build (validates MDX) and base-path audit"
run = ["bun run lint", "bun run screenshots:audit", "bun run build", "bun run base-path:audit"]

[tasks.openapi]
description = "Fetch openapi.json from rezepte --demo and regenerate content/api/reference.mdx"
depends = ["//service:build"]
run = ["scripts/with-demo.sh bun run openapi:fetch", "bun run openapi:generate"]

[tasks.screenshots]
description = "Regenerate the screenshots against rezepte --demo on :8070 (needs a Chromium that starts; not run in CI)"
depends = ["//service:build"]
# `--update-snapshots` alone writes only what exceeds maxDiffPixelRatio, so a
# change too small for the tolerance - a typeface swap across a few lines of a
# 1440x900 page - leaves stale PNGs behind. Regenerating means all of them.
run = "scripts/with-demo.sh bunx playwright test --update-snapshots=all"

[tasks."screenshots:audit"]
description = "Cross-check <Screenshot> names, tests and PNG files"
run = "bun run screenshots:audit"

[tasks."screenshots:check"]
description = "Report screenshot drift against rezepte --demo (local only)"
depends = ["//service:build"]
run = "scripts/with-demo.sh bunx playwright test"
