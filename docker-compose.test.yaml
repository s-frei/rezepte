# Test-only services; never part of a deployment. Dex is the OIDC provider
# (`mise run oidc:up`, which renders its config for this worktree's ports),
# Mailpit the SMTP server that catches every mail (`mise run mail:up`).
# Rezepte itself runs on the host, so "localhost" means the same thing to the
# browser and to the service.
name: rezepte-test-${RZP_DEX_PORT:-5556}
services:
  dex:
    image: ghcr.io/dexidp/dex:v2.45.1
    command: ["dex", "serve", "/etc/dex/config.yaml"]
    ports:
      - "${RZP_DEX_PORT:-5556}:5556"
    volumes:
      - ./.oidc/dex.yaml:/etc/dex/config.yaml:ro
  mailpit:
    image: axllent/mailpit:v1.31
    ports:
      - "${RZP_MAILPIT_SMTP_PORT:-1025}:1025"
      - "${RZP_MAILPIT_UI_PORT:-8025}:8025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
