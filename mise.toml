min_version = "2026.9.0"
monorepo_root = true

[monorepo]
config_roots = ["service", "frontend", "docs/memory", "docs/user"]

[tools]
go = "1.27.1"
bun = "1.4.2"
node = "24.21.0"
golangci-lint = "2.13.2"
sqlc = "1.31.1"
watchexec = "2.7.3"

[settings]
lockfile = true

[tasks.setup]
description = "Install all dependencies"
depends = ["//frontend:install", "//docs/memory:install", "//docs/user:install"]
run = "cd service && go mod download"

[tasks.dev]
description = "Run Go API and SvelteKit dev server"
depends = ["//service:dev", "//frontend:dev"]

[tasks.check]
description = "All lint, format and test gates"
depends = ["//service:check", "//frontend:check", "//docs/memory:check", "//docs/user:check"]

[tasks.build]
description = "Build frontend, then the Go binary with embedded assets"
depends = ["//service:build"]

[tasks.docs]
description = "Run both documentation sites (:4000 memory, :4001 user)"
depends = ["//docs/memory:dev", "//docs/user:dev"]

[tasks.e2e]
description = "Build, start the binary on :8060 with a temp data dir, run Playwright"
depends = ["build"]
run = '''
set -eu
DATA_DIR=$(mktemp -d)
REZEPTE_ADDR=:8060 REZEPTE_DATA_DIR="$DATA_DIR" REZEPTE_ADMIN_PASSWORD=e2e-password ./service/bin/rezepte &
PID=$!
trap 'kill $PID' EXIT
for _ in $(seq 1 50); do curl -sf localhost:8060/healthz >/dev/null && break; sleep 0.1; done
cd frontend && bun run test:e2e
'''
