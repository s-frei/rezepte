min_version = "2026.9.0"
monorepo_root = true

[monorepo]
config_roots = ["service", "frontend", "docs/memory", "docs/user"]

[tools]
go = "1.27.1"
bun = "1.4.2"
golangci-lint = "2.13.2"
sqlc = "1.31.1"
watchexec = "2.7.3"

[settings]
lockfile = true

# Every port in this repo derives from one offset, so two worktrees can run
# their stacks side by side. The offset lives in the worktree's
# mise.local.toml (gitignored); without one it is 0 and every port below is
# the value it has always had.
#
# The offset is a var, not an env: file tasks (mise/tasks/*) and `mise env`
# render the root [env] block before mise.local.toml's [env] applies, so an
# `env.` offset silently resolves to 0 there while TOML tasks see it. [vars]
# are collected first and have no such ordering. Never use
# `get_env(name=...)` either: it reads only the process environment.
#
# The `env.` fallback keeps a mise.local.toml that still sets the offset under
# [env] working as it did before; worktree:new writes [vars].
[env]
REZEPTE_PORT_OFFSET  = "{{ vars.REZEPTE_PORT_OFFSET | default(value='0') }}"
RZP_BACKEND_PORT     = "{{ 8060 + (vars.REZEPTE_PORT_OFFSET | default(value=env.REZEPTE_PORT_OFFSET | default(value='0')) | int) * 100 }}"
RZP_FRONTEND_PORT    = "{{ 9060 + (vars.REZEPTE_PORT_OFFSET | default(value=env.REZEPTE_PORT_OFFSET | default(value='0')) | int) * 100 }}"
RZP_DEMO_PORT        = "{{ 8070 + (vars.REZEPTE_PORT_OFFSET | default(value=env.REZEPTE_PORT_OFFSET | default(value='0')) | int) * 100 }}"
RZP_DOCS_MEMORY_PORT = "{{ 4000 + (vars.REZEPTE_PORT_OFFSET | default(value=env.REZEPTE_PORT_OFFSET | default(value='0')) | int) * 100 }}"
RZP_DOCS_USER_PORT   = "{{ 4001 + (vars.REZEPTE_PORT_OFFSET | default(value=env.REZEPTE_PORT_OFFSET | default(value='0')) | int) * 100 }}"

[tasks.setup]
description = "Install all dependencies"
depends = ["//frontend:install", "//docs/memory:install", "//docs/user:install"]
run = "cd service && go mod download"

[tasks.dev]
description = "Run Go API and SvelteKit dev server"
depends = ["//service:dev", "//frontend:dev"]

[tasks.check]
description = "All lint, format and test gates"
depends = ["guard:local-config", "docker:compose:check", "//service:check", "//frontend:check", "//docs/memory:check", "//docs/user:check"]

[tasks.build]
description = "Build frontend, then the Go binary with embedded assets"
depends = ["//service:build"]

[tasks."guard:local-config"]
description = "Fail if a mise.local.toml ever got committed"
# .gitignore excludes it at every depth, so this can only happen through a
# deliberate `git add -f`. An offset loose in the main checkout shifts its
# ports for reasons nobody can see, so catch it at the gate.
run = '''
set -eu
found=$(git ls-files '*mise.local.toml' 'mise.local.toml')
if [ -n "$found" ]; then
	echo "guard: mise.local.toml is tracked - it must never be committed:" >&2
	echo "$found" >&2
	echo "guard: run 'git rm --cached <file>' and keep it untracked" >&2
	exit 1
fi
'''

[tasks."docker:build"]
description = "Build the container image for this machine, stamped with this checkout's version"
# The version is derived the same way //service:build:only derives it, so a
# locally built image reports what a released one would. CI builds two
# platforms; this builds one, because the point here is a fast loop. Only
# rezepte:local is tagged - it is what `docker:demo` runs, and a
# per-version tag would leave one more image behind on every commit.
run = '''
set -eu
VERSION="${REZEPTE_VERSION:-$(git describe --tags --always 2>/dev/null || echo dev)}"
VERSION="${VERSION#v}"
docker build --build-arg "REZEPTE_VERSION=$VERSION" -t rezepte:local .
echo "docker:build: tagged rezepte:local, version $VERSION"
'''

[tasks."docker:compose:check"]
description = "Validate that docker-compose.yaml parses"
# docker-compose.yaml is handed to users and rendered into two documentation
# pages, so nothing here runs it - this is the only thing that checks it is
# still valid, which is why `check` depends on it.
#
# Nothing else in `check` needs Docker, and a contributor working on the
# frontend should not have to install it. So this skips when `docker compose`
# is missing - out loud, because a gate that quietly does nothing is worse than
# no gate. CI always has Docker, so the file is never merged unvalidated.
run = '''
set -eu
if ! docker compose version >/dev/null 2>&1; then
	echo "docker:compose:check: skipped, 'docker compose' is not available here"
	exit 0
fi
docker compose -f docker-compose.yaml config -q
'''

[tasks."docker:demo"]
description = "Build the image and run it in demo mode on this worktree's demo port"
depends = ["docker:build"]
# This exists to exercise the *image* - distroless, the nonroot UID, the
# entrypoint, the version stamp - which `//docs/user:screenshots` and the rest
# of the demo tooling cannot, because they run the binary directly.
#
# Deliberately not compose: docker-compose.yaml is the users' file, and a demo
# overlay would have to replace every key in it, leaving a mechanism that
# proves nothing about the file it layers over. --rm keeps nothing behind, so
# every run seeds a fresh database.
run = '''
set -eu
echo "docker:demo: http://localhost:$RZP_DEMO_PORT - log in as demo / demo1234"
docker run --rm -p "$RZP_DEMO_PORT:8060" rezepte:local --demo
'''

[tasks.docs]
description = "Run both documentation sites (memory :4000, user :4001 by default; mise run ports for this worktree)"
depends = ["//docs/memory:dev", "//docs/user:dev"]

