[tasks.dev]
description = "Run the API with reload on Go file changes"
# REZEPTE_ADDR is the binary's own variable; RZP_BACKEND_PORT is this
# worktree's port. Keep the translation here rather than renaming the Go
# side, which is an operator-facing setting.
run = "REZEPTE_ADDR=\"${REZEPTE_ADDR:-:$RZP_BACKEND_PORT}\" watchexec --restart --exts go --ignore 'internal/web/dist/**' -- go run ./cmd/rezepte"

[tasks.test]
description = "Run Go tests"
run = "go test ./..."

[tasks.lint]
description = "Run golangci-lint"
run = "golangci-lint run"

[tasks.fmt]
description = "Format Go code"
run = "golangci-lint fmt"

[tasks."fmt:check"]
description = "Fail if Go code is not formatted"
run = "golangci-lint fmt --diff"

[tasks.generate]
description = "Generate sqlc code"
run = "sqlc generate"

[tasks."generate:check"]
description = "Fail if generated sqlc code is stale"
run = "sqlc diff"

[tasks.check]
description = "Vet, format check, lint, test"
depends = ["fmt:check", "generate:check", "lint", "test"]
run = "go vet ./..."

[tasks."build:only"]
description = "Build the Go binary from whatever is already in internal/web/dist"
# Separate from `build` so the release task can build the SPA once and then
# cross-compile four times. GOOS and GOARCH are read from the environment, so
# the compiler flags stay defined here and nowhere else - including the version
# stamp, which is why the release task has to pass REZEPTE_VERSION rather than
# build its own command.
run = '''
set -eu
VERSION="${REZEPTE_VERSION:-$(git describe --tags --always 2>/dev/null || echo dev)}"
VERSION="${VERSION#v}"
CGO_ENABLED=0 go build -trimpath -ldflags="-s -w -X main.version=$VERSION" -o bin/rezepte ./cmd/rezepte
'''

[tasks.build]
description = "Build the binary with the embedded frontend"
depends = ["//frontend:build"]
run = "mise run //service:build:only"
